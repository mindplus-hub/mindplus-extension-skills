version: '1.0'
name: release-workbuddy
displayName: MindPlus Skills Release
# Reference the encrypted common variable by name; its value stays in Gitee Go.
variables:
  global:
    - MP_RELEASE_TOKEN
triggers:
  push:
    tags:
      include:
        - '^v[0-9]+\.[0-9]+\.[0-9]+$'
stages:
  - stage:
    name: package_release
    displayName: 打包并更新发行版
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: package_workbuddy
        displayName: 构建并发布双 ZIP 和 SHA-256
        pythonVersion: '3.9'
        # Configure MP_RELEASE_TOKEN as a secret variable injected into this build task.
        # Never put the actual Token value in this YAML or print it.
        # The documented base image offers 3.9; the scripts support its bundled Python 3.9.
        commands:
          - |
            set -eu
            set +x
            stage=locate_checkout
            trap 'code=$?; if [ "$code" -ne 0 ]; then echo "[FAIL] stage=$stage exit=$code (124 means timeout)"; fi' EXIT
            checkout_found=false
            # The plugin logs WORKSPACE but may not export it to COMMAND.sh.
            for candidate in "${MP_CHECKOUT_DIR:-}" "${WORKSPACE:-}" "$(pwd -P 2>/dev/null || true)" /root/workspace/mind-plus/mindplus-extension-skills; do
              if [ -n "$candidate" ] && [ -f "$candidate/VERSION" ] && [ -f "$candidate/tools/pack_workbuddy.py" ] && [ -f "$candidate/SKILL.md" ]; then
                cd "$candidate"
                checkout_found=true
                break
              fi
            done
            if [ "$checkout_found" != true ]; then
              echo "[FAIL] Checkout not found. Set MP_CHECKOUT_DIR to the repository directory shown by the plugin."
              exit 1
            fi
            echo "[0/3] Checkout: $(pwd -P)"
            export PYTHONUTF8=1
            export PYTHONDONTWRITEBYTECODE=1
            export PYTHONUNBUFFERED=1
            stage=check_python
            echo "[1/3] Checking bundled Python (no runtime download)"
            python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 9), "Python 3.9+ required"'
            stage=check_credential_binding
            # Export a shell variable supplied by the platform to child processes.
            # Exporting cannot create a value if the platform has not bound it.
            if [ -z "${MP_RELEASE_TOKEN:-}" ]; then
              echo "[FAIL] MP_RELEASE_TOKEN is absent/empty. Check its saved value in Gitee Go common variables and the variables.global reference in this branch's workflow."
              exit 1
            fi
            export MP_RELEASE_TOKEN
            python3 -c 'import os; assert os.environ.get("MP_RELEASE_TOKEN"), "MP_RELEASE_TOKEN not exported"; print("[AUTH] MP_RELEASE_TOKEN is available to Python (value hidden)")'
            stage=fetch_tags
            echo "[2/3] Fetching version tags (maximum 120 seconds)"
            timeout 120s git fetch --tags origin
            stage=publish
            echo "[3/3] Building WB/source ZIPs and SHA-256 files, then publishing Release (maximum 600 seconds)"
            timeout 600s python3 -B tools/pack_workbuddy.py --publish --tag "v$(tr -d '\r\n' < VERSION)"
            echo "[DONE] Release completed: two ZIPs and two verified SHA-256 attachments"
        artifacts:
          - name: SKILL_RELEASE
            path:
              - ./dist
