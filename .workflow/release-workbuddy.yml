version: '1.0'
name: release-workbuddy
displayName: MindPlus WB Release
triggers:
  push:
    tags:
      include:
        - '^v[0-9]+\.[0-9]+\.[0-9]+$'
stages:
  - stage:
    name: package_release
    displayName: 打包并更新发行版
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: package_workbuddy
        displayName: 构建并发布 WB ZIP
        pythonVersion: '3.9'
        # Bind a credential outside the checkout: ~/.gitee-token or GITEE_TOKEN_FILE.
        # Existing secret GITEE_TOKEN/MP_RELEASE_TOKEN bindings also work; never store values here.
        # The documented base image offers 3.9; the scripts support its bundled Python 3.9.
        commands:
          - |
            set -eu
            set +x
            stage=locate_checkout
            trap 'code=$?; if [ "$code" -ne 0 ]; then echo "[FAIL] stage=$stage exit=$code (124 means timeout)"; fi' EXIT
            checkout_found=false
            # The plugin logs WORKSPACE but may not export it to COMMAND.sh.
            for candidate in "${MP_CHECKOUT_DIR:-}" "${WORKSPACE:-}" "$(pwd -P 2>/dev/null || true)" /root/workspace/mind-plus/mindplus-agent-skill; do
              if [ -n "$candidate" ] && [ -f "$candidate/VERSION" ] && [ -f "$candidate/tools/pack_workbuddy.py" ] && [ -f "$candidate/SKILL.md" ]; then
                cd "$candidate"
                checkout_found=true
                break
              fi
            done
            if [ "$checkout_found" != true ]; then
              echo "[FAIL] Checkout not found. Set MP_CHECKOUT_DIR to the repository directory shown by the plugin."
              exit 1
            fi
            echo "[0/3] Checkout: $(pwd -P)"
            export PYTHONUTF8=1
            export PYTHONDONTWRITEBYTECODE=1
            export PYTHONUNBUFFERED=1
            stage=check_python
            echo "[1/3] Checking bundled Python (no runtime download)"
            python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 9), "Python 3.9+ required"'
            stage=fetch_tags
            echo "[2/3] Fetching version tags (maximum 120 seconds)"
            timeout 120s git fetch --tags origin
            stage=publish
            echo "[3/3] Building WB ZIP and publishing Release (maximum 600 seconds)"
            timeout 600s python3 -B tools/pack_workbuddy.py --publish --tag "v$(tr -d '\r\n' < VERSION)"
            echo "[DONE] WB Release completed"
        artifacts:
          - name: WB_RELEASE
            path:
              - ./dist
